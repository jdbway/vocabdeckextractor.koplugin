name: Check upstream VocabDeck compatibility

# Two ways this can start:
# - schedule: a cron expression, UTC time. "17 6 * * *" = 06:17 every day.
#   (Picked an off-the-hour minute on purpose -- GitHub throttles jobs that
#   all fire exactly on :00, so a lot of scheduled Actions pile up there.)
# - workflow_dispatch: adds a manual "Run workflow" button on the Actions
#   tab, with no inputs needed. Useful for testing without waiting for cron.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# GITHUB_TOKEN is an automatic, short-lived token GitHub mints for every
# workflow run -- no secret to create yourself. By default it can only read
# the repo; these two lines opt it up to also push a commit (contents) and
# open/comment on issues (issues) in *this* repo only.
permissions:
  contents: write
  issues: write

jobs:
  check-compat:
    runs-on: ubuntu-latest
    env:
      KOREADER_VERSION: "2026.07.1"
    steps:
      # Clones this repo (vocabdeckextractor.koplugin) onto the runner.
      # Every workflow that needs the repo's own files starts with this.
      - name: Check out this repo
        uses: actions/checkout@v4

      # KOReader's Linux .deb ships luajit plus every frontend/common Lua
      # module (datastorage, logger, the real lua-ljsqlite3 FFI binding,
      # etc.) that both VocabDeck's and this extractor's code need via
      # require(). Installing it directly on the runner -- no Xvfb, no
      # display, no GUI boot at all -- is enough: setupkoenv.lua (KOReader's
      # own require()-path bootstrap) plus KOReader's bundled luajit gives a
      # fully working headless Lua environment for pure data-layer code like
      # vocabdeck_db.lua. Confirmed live against the actual virtual-Kindle
      # container before building this: no display server needed anywhere
      # in this job.
      - name: Install KOReader's headless Lua runtime
        run: |
          set -eu
          wget -q "https://github.com/koreader/koreader/releases/download/v${KOREADER_VERSION}/koreader_${KOREADER_VERSION}-1_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "./koreader_${KOREADER_VERSION}-1_amd64.deb"
          rm -f "koreader_${KOREADER_VERSION}-1_amd64.deb"

      - name: Check compatibility against real upstream code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          PIN_DIR="compat/vocabdeck"
          PIN_FILE="$PIN_DIR/pin.json"
          UPSTREAM_REPO=$(jq -r '.upstream_repo' "$PIN_FILE")
          UPSTREAM_BRANCH=$(jq -r '.upstream_branch' "$PIN_FILE")
          PINNED_COMMIT=$(jq -r '.pinned_commit' "$PIN_FILE")

          git clone --quiet --depth 50 --branch "$UPSTREAM_BRANCH" \
            "https://github.com/$UPSTREAM_REPO.git" /tmp/upstream
          UPSTREAM_HEAD=$(git -C /tmp/upstream rev-parse HEAD)

          if [ "$UPSTREAM_HEAD" = "$PINNED_COMMIT" ]; then
            echo "Upstream hasn't moved since the last pin ($PINNED_COMMIT). Nothing to do."
            exit 0
          fi

          echo "Upstream moved: $PINNED_COMMIT -> $UPSTREAM_HEAD"

          # PRIMARY gate: actually exercise upstream's real vocabdeck_db.lua
          # (fresh clone, not our snapshot) to create a card the way
          # VocabDeck itself would, then run our own extractor against that
          # same on-disk database and assert every field round-trips. See
          # test/behavioral_check.lua for why this beats a source-file diff:
          # a diff can be a false alarm (a comment or rename with no real
          # behavior change) or a false pass (a formatting-only diff hiding
          # a real change) -- this proves the actual behavior.
          export KO_MULTIUSER=1
          export KO_HOME=/tmp/ko_ci_home
          mkdir -p "$KO_HOME"
          export UPSTREAM_DIR=/tmp/upstream
          export EXTRACTOR_DIR="$GITHUB_WORKSPACE"

          set +e
          BEHAVIORAL_OUTPUT=$(cd /usr/lib/koreader && ./luajit -e "dofile('setupkoenv.lua'); dofile(os.getenv('EXTRACTOR_DIR') .. '/test/behavioral_check.lua')" 2>&1)
          BEHAVIORAL_STATUS=$?
          set -e
          echo "$BEHAVIORAL_OUTPUT"

          # SECONDARY check: vocabdeck_memory_helper.lua asks an AI provider
          # for a fixed set of plain-text section labels (see
          # memory_helper_parser.lua's own comment) -- there's no pure,
          # non-AI-calling function to exercise behaviorally, so this file
          # stays on the source-diff approach from v1.
          MEM_DRIFTED=0
          if ! diff -u "$PIN_DIR/vocabdeck_memory_helper.lua" "/tmp/upstream/vocabdeck_memory_helper.lua" > /tmp/mem_diff 2>&1; then
            MEM_DRIFTED=1
          fi

          if [ "$BEHAVIORAL_STATUS" = "0" ] && [ "$MEM_DRIFTED" = "0" ]; then
            echo "Behavioral check passed and memory-helper format unchanged -- safe to auto-advance the pin."
            cp "/tmp/upstream/vocabdeck_db.lua" "$PIN_DIR/vocabdeck_db.lua"
            cp "/tmp/upstream/vocabdeck_memory_helper.lua" "$PIN_DIR/vocabdeck_memory_helper.lua"
            jq --arg sha "$UPSTREAM_HEAD" --arg date "$(date -u +%Y-%m-%d)" \
              '.pinned_commit = $sha | .last_checked = $date' "$PIN_FILE" > /tmp/pin.json
            mv /tmp/pin.json "$PIN_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$PIN_DIR"
            git commit -m "Auto-advance vocabdeck.koplugin pin to $UPSTREAM_HEAD (behavioral check passed, memory-helper format unchanged)"
            git push
            exit 0
          fi

          echo "Compatibility check failed -- NOT advancing the pin. Filing an issue."

          TITLE="Upstream drift: vocabdeck.koplugin"
          BODY=$(printf '%s moved from `%s` to `%s` on `%s`.\n\nThis pin was **not** auto-advanced.\n' "$UPSTREAM_REPO" "$PINNED_COMMIT" "$UPSTREAM_HEAD" "$UPSTREAM_BRANCH")

          if [ "$BEHAVIORAL_STATUS" != "0" ]; then
            BODY="$BODY$(printf '\n### Behavioral check failed\n\nRan upstream'"'"'s real vocabdeck_db.lua against extractor_vocabdeck.lua directly (see test/behavioral_check.lua) and the fields did not round-trip:\n\n```\n%s\n```\n' "$BEHAVIORAL_OUTPUT")"
          fi

          if [ "$MEM_DRIFTED" = "1" ]; then
            BODY="$BODY$(printf '\n### vocabdeck_memory_helper.lua changed (source diff -- not behaviorally testable, needs a human look)\n\n```diff\n%s\n```\n' "$(cat /tmp/mem_diff)")"
          fi

          BODY="$BODY$(printf '\nOnce fixed and confirmed, update `%s/pin.json` and the snapshot file(s) by hand.\n' "$PIN_DIR")"

          EXISTING=$(gh issue list --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number' || true)
          if [ -n "${EXISTING:-}" ]; then
            echo "Existing drift issue #$EXISTING is still open -- adding a comment instead of opening a duplicate."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

          # Non-zero exit makes the Actions tab show this run as failed (red X),
          # which is a second, more visible signal on top of the issue.
          exit 1
